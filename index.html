<!DOCTYPE html>

<style>
:root{
  --navy:#1f3a5f; --navy2:#2c5282; --paper:#f4f7fb; --card:#ffffff; --line:#d5dde8;
  --ink:#1d2733; --sub:#5b6b7e; --accent:#f08c00; --good:#2f9e44; --bad:#e03131; --blue:#1971c2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100dvh;min-height:560px}
header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:7px 14px;display:flex;align-items:center;gap:12px;flex:0 0 auto}

#palette{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;overflow:auto}
#palette h2,#panel h3{margin:0;font-size:12.5px;color:var(--sub);font-weight:700}
.pitem{display:flex;flex-direction:column;align-items:center;gap:1px;background:#f7f9fc;border:1.5px solid var(--line);border-radius:10px;padding:5px 2px 4px;font-weight:700;font-size:13px;min-height:56px}
.pitem:active{background:#e7f0ff;border-color:var(--blue)}

.wiretip{font-size:11.5px;line-height:1.4;color:var(--sub);background:#fff8e6;border:1px dashed #f0b429;border-radius:10px;padding:6px}
#boardWrap{display:flex;flex-direction:column;min-width:0;min-height:0;gap:6px}
#toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;font-weight:700;min-height:36px}
.btn:active{background:#e7f0ff}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--bad);border-color:#f3b4b4}

#board text{font-family:inherit;pointer-events:none}
#panel{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
#tabs button{flex:1;border:0;background:transparent;padding:10px 2px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;min-height:44px}

.card{background:#f8fafd;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.card h3{font-size:14px;color:var(--navy);margin:0 0 5px}

.card ol,.card ul{margin:3px 0;padding-left:18px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:5px 0}

details[open]>summary{border-bottom:1px dashed var(--line);margin-bottom:6px}
details .ans{background:#f1faf3;border:1px solid #bfe3c9;border-radius:8px;padding:2px 8px;margin:6px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:4px 5px;text-align:center;white-space:nowrap}
th{background:#eef3fa;color:var(--navy);font-weight:800}
.tblwrap{overflow:auto;border-radius:8px}
input[type=range]{width:100%;height:34px;accent-color:var(--accent)}
select{border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff;font-weight:700;min-height:36px}

.zhead{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:16px}

.tbl-end{text-align:left}
@media (max-width:1100px){#main{grid-template-columns:120px minmax(0,1fr) 360px}#main.wide{grid-template-columns:120px minmax(0,1fr) 0}.pitem svg{width:68px}}
@media (max-width:820px){
  html,body{height:auto}
  #app{height:auto}
  #main,#main.wide{grid-template-columns:1fr;grid-auto-rows:auto}
  #palette{flex-direction:row;overflow:auto;order:1}
  #palette h2,.wiretip{display:none}
  .pitem{min-width:90px}
  #boardWrap{order:2}
  #boardBox{height:62vw;min-height:320px;flex:none}
  #panel{order:3;min-height:440px}
}

</head>
<body>
<div id="app">
  <header>
    <h1>⚡ 전기 회로 가상 실험실</h1>
    <span class="sub">전류계·전압계 · 옴의 법칙 · 직렬/병렬 연결</span>
    <span class="ver" id="verTag"></span>
    <span class="brand">MINARI STUDIO</span>
  </header>
  <div id="main">
    <aside id="palette"></aside>
    <section id="boardWrap">
      <div id="toolbar"></div>
      <div id="msgs"></div>
      <div id="boardBox"><svg id="board" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg></div>
    </section>
    <aside id="panel">
      <div id="tabs">
        <button data-tab="guide">📖 가이드</button>
        <button data-tab="sel">🔧 선택</button>
        <button data-tab="rec">🗂 기록</button>
        <button data-tab="graph">📈 그래프</button>
      </div>
      <div id="tabBody"></div>
    </aside>
  </div>
</div>
<div id="zoomOv" hidden></div>
<div id="toast"></div>

<script>
/* ============================================================
   전기 회로 가상 실험실  (MINARI STUDIO)
   - 회로 해석: 수정 절점 해석(MNA). 전류계=매우 작은 저항, 전압계=매우 큰 저항
   - 계기는 실제처럼 + 단자 1개, − 단자 3개. 연결한 − 단자가 측정 범위를 결정
   - 전구는 저항 10Ω(일정)로 가정 (정격 6V, 0.6A)
   ============================================================ */
const VERSION='1.1.0';
const GRID=20;
const BULB_R=10, BULB_V=6, BULB_P=3.6;
const TYPES={
  battery:{name:'전원장치',pre:'E',T:60,pol:true,n:2},
  switch:{name:'스위치',pre:'S',T:60,n:2},
  bulb:{name:'전구',pre:'L',T:60,n:2},
  resistor:{name:'저항',pre:'R',T:60,n:2},
  ammeter:{name:'전류계',pre:'A',meter:true,n:4},
  voltmeter:{name:'전압계',pre:'V',meter:true,n:4}
};
const RES=[5,10,20,30,40,50,100];
const AR=[{k:'50mA',max:0.05,maj:0.01,div:5,unit:'mA',f:1000},{k:'500mA',max:0.5,maj:0.1,div:5,unit:'mA',f:1000},{k:'5A',max:5,maj:1,div:5,unit:'A',f:1}];
const VR=[{k:'3V',max:3,maj:1,div:5,unit:'V',f:1},{k:'15V',max:15,maj:5,div:5,unit:'V',f:1},{k:'30V',max:30,maj:10,div:5,unit:'V',f:1}];
const MTX={1:-54,2:-18,3:18,0:54};     // 계기 단자 x 위치: t1(−작은범위) t2(−중간) t3(−큰범위) t0(+)
const MTY=80;
const WCOL=['#e03131','#1971c2','#2f9e44','#f08c00','#7048e8','#0c8599'];
const SCOL=['#1971c2','#e8590c','#2f9e44','#9c36b5','#c2255c','#0b7285'];

let S={comps:[],wires:[],nid:1,cur:1,recs:[]};
let UI={sel:null,pend:null,tab:'guide',drag:null,hide:false,trend:false,gx:null,gy:null,zoom:false};
let VB={x:0,y:0,w:1000,h:620};
let undoStack=[];
let SOL={wireI:{}};
let MSGS=[];
const $=s=>document.querySelector(s);
const comp=id=>S.comps.find(c=>String(c.id)===String(id));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isMeter=c=>TYPES[c.type].meter;
const STRIP=['rd','tgt','over','rev','res','ct','na','nb','ta','rng','multi','nm'];
const clean=c=>{const o={};Object.keys(c).forEach(k=>{if(!STRIP.includes(k))o[k]=c[k];});return o;};

function defaults(t){return {battery:{val:6},resistor:{val:10},switch:{on:false},ammeter:{},voltmeter:{},bulb:{}}[t]||{};}
function nextName(type){const p=TYPES[type].pre;let n=1;const used=new Set(S.comps.filter(c=>c.type===type).map(c=>c.name));while(used.has(p+n))n++;return p+n;}
function meterRange(c){return c.type==='ammeter'?AR[c.rng]:VR[c.rng];}
function negNames(c){return (c.type==='ammeter'?AR:VR).map(r=>r.k);}

/* ---------- 단자 좌표 ---------- */
function tpos(k){
  const [i,t]=k.split(':');const c=comp(i);
  if(isMeter(c))return {x:c.x+MTX[t],y:c.y+MTY,dx:0,dy:1};
  const T=TYPES[c.type].T;
  const a=c.rot*Math.PI/180;const co=Math.round(Math.cos(a)),si=Math.round(Math.sin(a));
  const lx=t==='0'?T:-T,d=t==='0'?1:-1;
  return {x:c.x+lx*co,y:c.y+lx*si,dx:d*co,dy:d*si};
}
function rotp(c,lx,ly){const a=c.rot*Math.PI/180,co=Math.round(Math.cos(a)),si=Math.round(Math.sin(a));return {x:c.x+lx*co-ly*si,y:c.y+lx*si+ly*co};}
function wireGeom(w){
  const A=tpos(w.a),B=tpos(w.b);
  const dist=Math.max(36,Math.min(130,Math.hypot(A.x-B.x,A.y-B.y)*0.45));
  const P=[[A.x,A.y],[A.x+A.dx*dist,A.y+A.dy*dist],[B.x+B.dx*dist,B.y+B.dy*dist],[B.x,B.y]];
  const pts=[],cum=[0];let len=0;
  for(let i=0;i<=40;i++){
    const t=i/40,u=1-t;
    const x=u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0];
    const y=u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1];
    if(i>0){len+=Math.hypot(x-pts[i-1][0],y-pts[i-1][1]);cum.push(len);}
    pts.push([x,y]);
  }
  return {P,pts,cum,len,d:`M${P[0][0]},${P[0][1]} C${P[1][0]},${P[1][1]} ${P[2][0]},${P[2][1]} ${P[3][0]},${P[3][1]}`};
}

/* ============================================================
   회로 해석
   ============================================================ */
function gauss(A,z){
  const n=z.length;
  for(let i=0;i<n;i++){
    let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;
    if(Math.abs(A[p][i])<1e-13)return null;
    if(p!==i){[A[i],A[p]]=[A[p],A[i]];[z[i],z[p]]=[z[p],z[i]];}
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];if(f===0)continue;for(let k=i;k<n;k++)A[r][k]-=f*A[i][k];z[r]-=f*z[i];}
  }
  const x=new Array(n);
  for(let i=n-1;i>=0;i--){let s=z[i];for(let k=i+1;k<n;k++)s-=A[i][k]*x[k];x[i]=s/A[i][i];}
  return x;
}
function wiredTerms(c){const out=[];for(let t=0;t<TYPES[c.type].n;t++){const k=c.id+':'+t;if(S.wires.some(w=>w.a===k||w.b===k))out.push(t);}return out;}
function solveCircuit(){
  const R={singular:false,short:[],wireI:{}};
  /* 계기: 연결한 − 단자 결정 (여러 개면 가장 큰 범위 단자를 사용) */
  S.comps.forEach(c=>{
    if(!isMeter(c))return;
    const wt=wiredTerms(c).filter(t=>t>=1);
    c.multi=wt.length>1;c.nm=wt.length>0;
    c.ta=wt.length?Math.max(...wt):1;c.rng=c.ta-1;
  });
  const par={};const find=a=>{while(par[a]!==a){par[a]=par[par[a]];a=par[a];}return a;};
  S.comps.forEach(c=>{for(let t=0;t<TYPES[c.type].n;t++)par[c.id+':'+t]=c.id+':'+t;});
  S.wires.forEach(w=>{if(par[w.a]===undefined||par[w.b]===undefined)return;const a=find(w.a),b=find(w.b);if(a!==b)par[a]=b;});
  const idx={};let n=0;const net=k=>{const r=find(k);if(idx[r]===undefined)idx[r]=n++;return idx[r];};
  S.comps.forEach(c=>{c.na=net(c.id+':0');c.nb=net(c.id+':'+(isMeter(c)?c.ta:1));});
  const srcs=[],gs=[];
  S.comps.forEach(c=>{
    let g=null;
    switch(c.type){
      case 'resistor':g=1/c.val;break;
      case 'bulb':g=1/BULB_R;break;
      case 'switch':g=c.on?1000:1e-12;break;
      case 'ammeter':g=200;break;          // 내부 저항 0.005 Ω (매우 작음)
      case 'voltmeter':g=1e-6;break;       // 내부 저항 1 MΩ (매우 큼)
      case 'battery':if(c.na!==c.nb)srcs.push(c);else R.short.push(c);break;
    }
    if(g!==null)gs.push([c,g]);
  });
  const N=n+srcs.length;
  const A=Array.from({length:N},()=>new Array(N).fill(0));const z=new Array(N).fill(0);
  for(let i=0;i<n;i++)A[i][i]+=1e-9;
  gs.forEach(([c,g])=>{A[c.na][c.na]+=g;A[c.nb][c.nb]+=g;A[c.na][c.nb]-=g;A[c.nb][c.na]-=g;});
  srcs.forEach((c,k)=>{const r=n+k;A[c.na][r]+=1;A[c.nb][r]-=1;A[r][c.na]+=1;A[r][c.nb]-=1;z[r]=c.val;});
  const x=gauss(A,z);
  const zeroCt=c=>new Array(TYPES[c.type].n).fill(0);
  if(!x){R.singular=true;S.comps.forEach(c=>{c.res={V:0,I:0,P:0};c.ct=zeroCt(c);});return R;}
  const gmap=new Map(gs);
  S.comps.forEach(c=>{
    c.ct=zeroCt(c);
    if(c.type==='battery'){
      const k=srcs.indexOf(c);
      if(k<0){c.res={V:c.val,I:0,P:0};}
      else{const i=x[n+k];c.res={V:c.val,I:-i,P:-i*c.val};c.ct[0]=i;c.ct[1]=-i;}
    }else{
      const g=gmap.get(c),va=x[c.na],vb=x[c.nb],I=g*(va-vb);
      c.res={V:va-vb,I:I,P:(va-vb)*I};
      c.ct[0]=I;c.ct[isMeter(c)?c.ta:1]=-I;
    }
  });
  /* 전선 한 가닥마다 흐르는 전류(애니메이션용) */
  const groups={};
  S.wires.forEach(w=>{if(par[w.a]===undefined||par[w.b]===undefined)return;const r=find(w.a);(groups[r]=groups[r]||[]).push(w);});
  Object.values(groups).forEach(ws=>{
    const nodes=[],ni={};const add=k=>{if(ni[k]===undefined){ni[k]=nodes.length;nodes.push(k);}};
    ws.forEach(w=>{add(w.a);add(w.b);});
    const m=nodes.length;
    const inj=nodes.map(k=>{const [id,t]=k.split(':');return -comp(id).ct[+t];});
    const mean=inj.reduce((a,b)=>a+b,0)/m;for(let i=0;i<m;i++)inj[i]-=mean;
    const L=Array.from({length:m},()=>new Array(m).fill(0));
    ws.forEach(w=>{const a=ni[w.a],b=ni[w.b];L[a][a]++;L[b][b]++;L[a][b]--;L[b][a]--;});
    const ph=m>1?(gauss(L.slice(1).map(r=>r.slice(1)),inj.slice(1))||[]):[];
    const phi=[0,...ph];
    ws.forEach(w=>{R.wireI[w.id]=(phi[ni[w.a]]||0)-(phi[ni[w.b]]||0);});
  });
  return R;
}

function analyze(){
  SOL=solveCircuit();MSGS=[];
  const add=(lvl,t)=>MSGS.push({lvl,t});
  S.comps.forEach(c=>{
    if(!isMeter(c))return;
    const r=meterRange(c);
    c.rd=c.type==='ammeter'?c.res.I:c.res.V;
    c.over=c.rd>r.max*1.0001;
    c.rev=c.rd<-0.004*r.max;
    c.tgt=Math.max(-0.08,Math.min(1.06,c.rd/r.max));
  });
  if(SOL.singular){add('err','🔌 회로를 계산할 수 없어요. 전원장치끼리 병렬로 연결하지 않았는지 확인해요.');return;}
  const srcs=S.comps.filter(c=>c.type==='battery');
  if(!srcs.length)add('info','🔋 먼저 왼쪽에서 「전원장치」를 놓아 보세요.');
  SOL.short.forEach(c=>add('err',`⚠ 단락! ${c.name}의 + 단자와 − 단자가 전선으로 바로 이어졌어요. 전선을 점검해요.`));
  srcs.forEach(c=>{
    if(Math.abs(c.res.I)>5)add('err',`⚠ 단락 위험! ${c.name}에서 ${Math.abs(c.res.I).toFixed(0)} A의 큰 전류가 흘러요. (전류계를 부품과 '병렬'로 연결하지 않았나요?) 실제 실험이라면 계기와 전원이 망가져요.`);
  });
  S.comps.forEach(c=>{
    if(isMeter(c)){
      const r=meterRange(c),nn=negNames(c);
      const plusW=wiredTerms(c).includes(0);
      if(plusW&&!c.nm)add('warn',`🔌 ${c.name}: − 단자가 연결되지 않았어요. (− 단자 3개 중 하나를 연결해요)`);
      else if(c.multi)add('warn',`🔌 ${c.name}: − 단자는 하나만 연결해요. (지금은 가장 큰 범위 ${r.k} 단자로 측정)`);
      if(c.rev)add('warn',`↩ ${c.name}: 바늘이 거꾸로 가요! 전원장치의 + 쪽 전선을 계기의 + 단자(빨강)에 연결해야 해요.`);
      else if(c.over){
        const next=c.rng<2?nn[c.rng+1]:null;
        add('warn',`📈 ${c.name}: 측정 범위(${r.k})를 넘었어요!`+(next?` − 단자를 더 큰 ${next} 단자로 옮겨 연결해요.`:''));
      }
    }
    if(c.type==='bulb'&&c.res.V>BULB_V*1.2)add('warn',`💡 ${c.name}: 정격 전압(${BULB_V}V)보다 큰 ${c.res.V.toFixed(1)}V가 걸려요. 실제라면 필라멘트가 끊어질 수 있어요.`);
  });
  const vms=S.comps.filter(c=>c.type==='voltmeter');
  srcs.forEach(s=>{
    if(s.val>0.1&&Math.abs(s.res.I)<5e-4&&Math.abs(s.res.I)>1e-9&&vms.some(v=>Math.abs(v.res.I)>0.5*Math.abs(s.res.I))){
      add('info','🧪 전압계가 회로에 직렬로 들어갔어요. 전압계는 내부 저항이 아주 커서 전류가 거의 흐르지 않아요. (전압계는 부품과 병렬로!)');
    }
  });
  if(srcs.length&&srcs.every(s=>s.val>0.01&&Math.abs(s.res.I)<1e-4)&&!MSGS.some(m=>m.t.startsWith('🧪'))&&!SOL.short.length){
    add('info','🔓 회로가 열려 있어서 전류가 흐르지 않아요. 스위치를 닫거나 끊어진 곳을 이어 보세요.');
  }
  if(!MSGS.length&&srcs.length&&srcs.some(s=>Math.abs(s.res.I)>1e-4))add('ok','✅ 전류가 흐르는 중이에요. 계기 바늘을 읽고 [🗂 기록]에서 📌 기록해 보세요.');
}

function gaugeInner(c,det){
  const r=meterRange(c)||AR[0],m=c.type==='ammeter'?'A':'V',R0=44,cx=50,cy=62;
  let s=`<rect x="1" y="1" width="98" height="78" rx="9" fill="#fdf8e8" stroke="#2b2b2b" stroke-width="2"/>`;
  const nMaj=Math.round(r.max/r.maj),nMin=nMaj*r.div;

  for(let i=0;i<=40;i++){const a=(-50+100*i/40)*Math.PI/180;d+=(i?'L':'M')+(cx+R0*Math.sin(a)).toFixed(2)+','+(cy-R0*Math.cos(a)).toFixed(2);}
  s+=`<path d="${d}" fill="none" stroke="#333" stroke-width="1"/>`;
  for(let i=0;i<=nMin;i++){

    s+=`<line x1="${(cx+R0*Math.sin(a)).toFixed(2)}" y1="${(cy-R0*Math.cos(a)).toFixed(2)}" x2="${(cx+(R0-len)*Math.sin(a)).toFixed(2)}" y2="${(cy-(R0-len)*Math.cos(a)).toFixed(2)}" stroke="#222" stroke-width="${major?1.3:.7}"/>`;
    if(major){const rr=R0-13;const v=+(i/r.div*r.maj*r.f).toFixed(3);
      s+=`<text x="${(cx+rr*Math.sin(a)).toFixed(2)}" y="${(cy-rr*Math.cos(a)+2.5).toFixed(2)}" font-size="7.5" font-weight="700" text-anchor="middle" fill="#222">${v}</text>`;}
  }
  const col=m==='A'?'#c2410c':'#1d4ed8';
  s+=`<circle cx="50" cy="70.5" r="7.6" fill="#fff" stroke="${col}" stroke-width="1.2"/><text x="50" y="74" font-size="10" font-weight="900" text-anchor="middle" fill="${col}">${m}</text>`;
  s+=`<text x="86" y="75" font-size="8" font-weight="800" text-anchor="middle" fill="#444">${m==='A'?r.unit:'V'}</text>`;
  s+=`<g data-needle="1" data-for="${c.id}" transform="rotate(${ND[c.id]===undefined?-50:ND[c.id]} 50 62)"><line x1="${cx}" y1="${cy}" x2="${cx}" y2="22" stroke="#d6336c" stroke-width="1.6" stroke-linecap="round"/></g><circle cx="${cx}" cy="${cy}" r="3.2" fill="#333"/>`;

function applyView(){$('#board').setAttribute('viewBox',`${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);}
function fitView(){
  const bx=$('#board');const cw=bx.clientWidth||1000,ch=bx.clientHeight||620,asp=cw/ch;
  if(!S.comps.length){VB={x:0,y:0,w:1000,h:1000/asp};applyView();return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  S.comps.forEach(c=>{
    let a,b,d,e;
    if(isMeter(c)){a=c.x-92;b=c.x+92;d=c.y-95;e=c.y+110;}
    else{const h=c.rot%180===0;a=c.x-(h?84:60);b=c.x+(h?84:60);d=c.y-(h?60:84);e=c.y+(h?60:84);}
    x0=Math.min(x0,a);x1=Math.max(x1,b);y0=Math.min(y0,d);y1=Math.max(y1,e);
  });
  let w=x1-x0+80,h=y1-y0+80;
  if(w/h<asp)w=h*asp;else h=w/asp;
  VB={x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h};applyView();
}
function zoomBy(f,c){
  const cx=c?c.x:VB.x+VB.w/2,cy=c?c.y:VB.y+VB.h/2;
  const w=Math.max(260,Math.min(5000,VB.w*f)),k=w/VB.w;
  VB={x:cx-(cx-VB.x)*k,y:cy-(cy-VB.y)*k,w,h:VB.h*k};applyView();
}

/* ---------- 애니메이션: 전류 흐름 점, 바늘 ---------- */
const PH={},ND={};let lastT=0;
function frame(ts){
  const dt=Math.min(0.05,(ts-lastT)/1000||0.016);lastT=ts;
  updateAnim(dt);
  requestAnimationFrame(frame);
}
function updateAnim(dt){
  const board=$('#board');
  if(board){
    board.querySelectorAll('[data-dot]').forEach(el=>{
      const wid=+el.dataset.dot,g=GEO[wid];if(!g){return;}
      const I=SOL.wireI?(SOL.wireI[wid]||0):0,aI=Math.abs(I);
      if(aI<2e-4){el.setAttribute('opacity','0');return;}
      if(el.dataset.i==='0'){const sp=40+160*Math.min(1,Math.sqrt(aI/0.6));PH[wid]=((PH[wid]||0)+Math.sign(I)*sp*dt);}
      const n=+el.dataset.n,i=+el.dataset.i;
      let s=((PH[wid]||0)+i*g.len/n)%g.len;if(s<0)s+=g.len;
      let lo=0,hi=g.cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(g.cum[m]<=s)lo=m;else hi=m;}
      const seg=g.cum[hi]-g.cum[lo]||1,u=(s-g.cum[lo])/seg;
      el.setAttribute('cx',(g.pts[lo][0]+(g.pts[hi][0]-g.pts[lo][0])*u).toFixed(1));
      el.setAttribute('cy',(g.pts[lo][1]+(g.pts[hi][1]-g.pts[lo][1])*u).toFixed(1));
      el.setAttribute('opacity','1');
    });
  }
  document.querySelectorAll('[data-needle]').forEach(el=>{
    const c=comp(el.dataset.for);if(!c||c.tgt===undefined)return;
    const key=el.dataset.for;const tg=-50+100*c.tgt;
    let cur=ND[key];if(cur===undefined)cur=-50;
    cur+=(tg-cur)*Math.min(1,dt*9);ND[key]=cur;
    el.setAttribute('transform',`rotate(${cur.toFixed(2)} 50 62)`);
  });
}

   편집 동작
   ============================================================ */
function snap(){return JSON.stringify({comps:S.comps.map(clean),wires:S.wires,nid:S.nid});}
function pushUndo(s){undoStack.push(s||snap());if(undoStack.length>40)undoStack.shift();}
function restore(str){const o=JSON.parse(str);S.comps=o.comps;S.wires=o.wires;S.nid=o.nid;UI.sel=null;UI.pend=null;}
function mut(fn){pushUndo();fn();refresh();}
function addComp(type){
  mut(()=>{
    const big=TYPES[type].meter||S.comps.some(isMeter);
    const tw=big?210:150,th=big?210:110;
    const cx=Math.round((VB.x+VB.w/2)/GRID)*GRID,cy=Math.round((VB.y+VB.h/2)/GRID)*GRID;
    let x=cx,y=cy;
    outer:for(const dy of [0,-1,1,-2,2])for(const dx of [0,-1,1,-2,2,-3,3]){
      const px=cx+dx*tw*0.9,py=cy+dy*th*0.9;
      if(!S.comps.some(c=>Math.abs(c.x-px)<tw&&Math.abs(c.y-py)<th)){x=Math.round(px/GRID)*GRID;y=Math.round(py/GRID)*GRID;break outer;}
    }
    const c=Object.assign({id:S.nid++,type,x,y,rot:0,name:nextName(type)},defaults(type));
    S.comps.push(c);UI.sel={k:'c',id:c.id};if(UI.tab==='guide')UI.tab='sel';
  });
}
function delSel(){
  if(!UI.sel)return;
  mut(()=>{
    if(UI.sel.k==='c'){const id=UI.sel.id;S.comps=S.comps.filter(c=>c.id!==id);S.wires=S.wires.filter(w=>!w.a.startsWith(id+':')&&!w.b.startsWith(id+':'));}
    else S.wires=S.wires.filter(w=>w.id!==UI.sel.id);
    UI.sel=null;
  });
}
function addWire(a,b){
  if(a===b)return false;
  if(S.wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))){toast('이미 연결된 전선이에요');return false;}
  S.wires.push({id:S.nid++,a,b,col:S.wires.length%WCOL.length});return true;
}
function setVolt(id,v,live){
  const c=comp(id);if(!c||c.type!=='battery')return;
  c.val=Math.max(0,Math.min(12,Math.round(v)));
  analyze();renderBoard();renderToolbar();renderMsgs();renderZoom();
  if(live)refreshLive();save();
}

/* ---------- 포인터 입력 ---------- */
const board=$('#board');
function svgPt(e){const p=board.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(board.getScreenCTM().inverse());return {x:q.x,y:q.y};}
function nearestTerm(p,skip){
  let best=null,bd=34;
  S.comps.forEach(c=>{for(let t=0;t<TYPES[c.type].n;t++){const k=c.id+':'+t;if(k===skip)continue;const q=tpos(k);const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=k;}}});
  return best;
}
board.addEventListener('pointerdown',e=>{
  e.preventDefault();
  try{board.setPointerCapture(e.pointerId);}catch(_){}
  const p=svgPt(e),tEl=e.target.closest('[data-term]'),cEl=e.target.closest('[data-c]'),wEl=e.target.closest('[data-w]');
  if(tEl){UI.drag={kind:'wire',from:tEl.dataset.term,x:p.x,y:p.y,sx:p.x,sy:p.y,moved:false};UI.sel=null;}
  else if(cEl){
    const c=comp(cEl.dataset.c);UI.sel={k:'c',id:c.id};UI.pend=null;
    if(UI.tab==='guide')UI.tab='sel';
    UI.drag={kind:'comp',id:c.id,ox:p.x-c.x,oy:p.y-c.y,sx:p.x,sy:p.y,moved:false,snap:snap()};
  }
  else if(wEl){UI.sel={k:'w',id:+wEl.dataset.w};UI.pend=null;UI.drag=null;if(UI.tab==='guide')UI.tab='sel';}
  else{UI.sel=null;UI.pend=null;const m=board.getScreenCTM();UI.drag={kind:'pan',cx:e.clientX,cy:e.clientY,vx:VB.x,vy:VB.y,k:m?1/m.a:1,moved:false};}
  renderBoard();renderToolbar();renderPanel();renderZoom();
});
board.addEventListener('pointermove',e=>{
  const d=UI.drag;if(!d)return;
  if(d.kind==='pan'){
    if(!d.moved&&Math.hypot(e.clientX-d.cx,e.clientY-d.cy)>5)d.moved=true;
    if(d.moved){VB.x=d.vx-(e.clientX-d.cx)*d.k;VB.y=d.vy-(e.clientY-d.cy)*d.k;applyView();}
    return;
  }
  const p=svgPt(e);
  if(!d.moved&&Math.hypot(p.x-d.sx,p.y-d.sy)>8)d.moved=true;
  if(d.kind==='wire'){d.x=p.x;d.y=p.y;if(d.moved)renderBoard();}
  else if(d.kind==='comp'&&d.moved){
    const c=comp(d.id);
    c.x=Math.max(-2500,Math.min(3500,Math.round((p.x-d.ox)/GRID)*GRID));
    c.y=Math.max(-2500,Math.min(3500,Math.round((p.y-d.oy)/GRID)*GRID));
    renderBoard();
  }
});
function endDrag(e){
  const d=UI.drag;if(!d)return;
  UI.drag=null;
  if(d.kind==='pan'){renderBoard();return;}
  if(d.kind==='wire'){
    const p=svgPt(e);
    if(d.moved){
      const to=nearestTerm(p,d.from);
      if(to){pushUndo();addWire(d.from,to);}
      UI.pend=null;
    }else{
      if(UI.pend&&UI.pend!==d.from){pushUndo();addWire(UI.pend,d.from);UI.pend=null;}
      else UI.pend=(UI.pend===d.from)?null:d.from;
    }
  }else if(d.kind==='comp'){
    const c=comp(d.id);
    if(d.moved)pushUndo(d.snap);
    else if(c&&c.type==='switch'){pushUndo();c.on=!c.on;}
  }
  refresh();
}
board.addEventListener('pointerup',endDrag);
board.addEventListener('pointercancel',()=>{UI.drag=null;renderBoard();});
board.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?0.88:1.14,svgPt(e));},{passive:false});

function renderToolbar(){
  const t=$('#toolbar');
  let right='';
  if(UI.sel){
    if(UI.sel.k==='c'){const c=comp(UI.sel.id);if(c){
      right=`<span class="chip">${c.name} ${TYPES[c.type].name}${c.type==='battery'?' · '+c.val+' V':''}</span>`;
      if(c.type==='battery')right+=`<button class="btn num" data-tb="vm">− 1V</button><button class="btn num pri" data-tb="vp">+ 1V</button>`;

  t.innerHTML=`<button class="btn" data-tb="undo">↶</button><button class="btn" data-tb="clear">🧹</button>${exSel}<button class="btn" data-tb="zin">＋</button><button class="btn" data-tb="zout">－</button><button class="btn" data-tb="fit">⛶ 맞춤</button><button class="btn ${$('#main').classList.contains('wide')?'on':''}" data-tb="wide">↔ 넓게</button><span style="flex:1"></span>${right}`;

$('#toolbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-tb]');if(!b)return;
  const a=b.dataset.tb;const c=UI.sel&&UI.sel.k==='c'?comp(UI.sel.id):null;
  if(a==='undo'){if(undoStack.length){restore(undoStack.pop());refresh();}else toast('되돌릴 작업이 없어요');}
  else if(a==='clear'){if(S.comps.length){mut(()=>{S.comps=[];S.wires=[];UI.sel=null;UI.pend=null;});}}
  else if(a==='rot')rotSel();
  else if(a==='del')delSel();
  else if(a==='vm'&&c){pushUndo();setVolt(c.id,c.val-1,true);renderPanel();}
  else if(a==='vp'&&c){pushUndo();setVolt(c.id,c.val+1,true);renderPanel();}
  else if(a==='zin')zoomBy(0.8);
  else if(a==='zout')zoomBy(1.25);
  else if(a==='fit')fitView();
  else if(a==='wide'){$('#main').classList.toggle('wide');renderToolbar();setTimeout(fitView,50);}
});
$('#toolbar').addEventListener('change',e=>{if(e.target.id==='exsel'&&e.target.value){const v=e.target.value;e.target.value='';loadEx(v);}});
function rotSel(){if(UI.sel&&UI.sel.k==='c'){const c=comp(UI.sel.id);if(isMeter(c)){toast('계기는 회전하지 않아요');return;}mut(()=>{c.rot=(c.rot+90)%360;});}}

/* ============================================================
   예제 회로
   ============================================================ */
function loadEx(name){
  pushUndo();
  S.comps=[];S.wires=[];UI.sel=null;UI.pend=null;
  const mk=(type,nm,x,y,rot,o)=>{const c=Object.assign({id:S.nid++,type,x,y,rot,name:nm},defaults(type),o||{});S.comps.push(c);return c.id;};
  const wi=(a,ta,b,tb)=>S.wires.push({id:S.nid++,a:a+':'+ta,b:b+':'+tb,col:S.wires.length%WCOL.length});
  if(name==='basic'||name==='ohm'){
    const ohm=name==='ohm';
    const E=mk('battery','E1',100,420,270,{val:ohm?1:6});
    const Sw=mk('switch','S1',240,300,0,{on:true});
    const A=mk('ammeter','A1',400,150,0);
    const L=ohm?mk('resistor','R1',700,420,90,{val:10}):mk('bulb','L1',700,420,90);
    const V=mk('voltmeter','V1',940,340,0);
    wi(E,0,Sw,1);wi(Sw,0,A,0);wi(A,ohm?2:3,L,1);wi(L,0,E,1);wi(V,0,L,1);wi(V,2,L,0);
  }else if(name==='series'){
    const E=mk('battery','E1',100,420,270,{val:6});
    const Sw=mk('switch','S1',240,300,0,{on:true});
    const A=mk('ammeter','A1',400,150,0);
    const R1=mk('resistor','R1',660,300,0,{val:10});
    const R2=mk('resistor','R2',900,420,90,{val:20});
    const V1=mk('voltmeter','V1',660,120,0);
    const V2=mk('voltmeter','V2',1100,380,0);
    wi(E,0,Sw,1);wi(Sw,0,A,0);wi(A,2,R1,1);wi(R1,0,R2,1);wi(R2,0,E,1);
    wi(V1,0,R1,1);wi(V1,1,R1,0);wi(V2,0,R2,1);wi(V2,2,R2,0);
  }else if(name==='parallel'){
    const E=mk('battery','E1',100,420,270,{val:6});
    const Sw=mk('switch','S1',240,300,0,{on:true});
    const A1=mk('ammeter','A1',400,150,0);
    const A2=mk('ammeter','A2',640,150,0);
    const R1=mk('resistor','R1',640,400,90,{val:10});
    const A3=mk('ammeter','A3',900,150,0);
    const R2=mk('resistor','R2',900,400,90,{val:20});
    const V1=mk('voltmeter','V1',780,340,0);
    wi(E,0,Sw,1);wi(Sw,0,A1,0);wi(A1,3,A2,0);wi(A1,3,A3,0);
    wi(A2,3,R1,1);wi(A3,2,R2,1);wi(R1,0,E,1);wi(R2,0,E,1);wi(V1,0,R2,1);wi(V1,2,R2,0);
  }
  refresh();fitView();
  toast('예제 회로를 불러왔어요 · ↶로 이전 회로 복구');
}

function meterStatus(c){

  if(Math.abs(c.rd)/r.max<0.15&&Math.abs(c.rd)>1e-9&&c.rng>0)return `<p class="msg info">🔎 바늘이 눈금의 1/6도 안 움직여요. 더 작은 − 단자(${negNames(c)[c.rng-1]})로 옮기면 더 정확히 읽어요.</p>`;

const unitOf=l=>l[0]==='A'?'A':'V';
function labelsAll(){const L=[];S.recs.forEach(r=>Object.keys(r.vals).forEach(k=>{if(!L.includes(k))L.push(k);}));
  const o={E:0,A:1,V:2};return L.sort((a,b)=>(o[a[0]]-o[b[0]])||(parseInt(a.slice(1))-parseInt(b.slice(1))));}
function recordNow(){
  const ms=S.comps.filter(isMeter);
  if(!ms.length){toast('전류계나 전압계를 먼저 연결해 주세요');return;}
  const bad=ms.find(c=>c.over||c.rev||!c.nm);
  if(bad){toast(`${bad.name}: ${!bad.nm?'− 단자 연결':bad.rev?'+ − 연결':'측정 범위'}을(를) 먼저 바로잡아요`);return;}
  const vals={};
  S.comps.filter(c=>c.type==='battery').forEach(c=>vals[c.name]=c.val);
  ms.forEach(c=>vals[c.name]=c.type==='ammeter'?+c.rd.toFixed(3):+c.rd.toFixed(2));
  S.recs.push({id:S.nid++,set:S.cur,vals});
  save();renderPanel();toast('📌 기록했어요! ('+S.recs.length+'번째)');
}
function recHTML(){
  const L=labelsAll();
  const vs=L.filter(l=>l[0]==='V'),as=L.filter(l=>l[0]==='A');
  const ratio=vs.length&&as.length;
  let h=`<div class="row"><button class="btn pri" data-act="rec">📌 지금 값 기록</button><button class="btn" data-act="newset">➕ 새 세트 (현재 ${S.cur}세트)</button></div>
  <div class="row"><button class="btn sm" data-act="csv">⬇ CSV 저장</button><button class="btn sm danger" data-act="clrrec">🗑 기록 지우기</button></div>`;
  if(!S.recs.length)return h+`<div class="card"><p>회로를 만들고 계기를 읽은 뒤 <b>📌 지금 값 기록</b>을 눌러요. 전원 전압을 <b>1V씩 올리며</b> 여러 번 기록하면 그래프에 점이 찍혀요.</p>
    <p class="sel-note">계기 바늘이 반대로 가거나 범위를 넘은 상태, − 단자가 없는 상태에서는 기록되지 않아요.</p></div>`;
  h+=`<div class="tblwrap"><table><tr><th>#</th><th>세트</th>${L.map(l=>`<th>${l}<br>(${unitOf(l)})</th>`).join('')}${ratio?`<th>${vs[0]}÷${as[0]}<br>(Ω)</th>`:''}<th></th></tr>`;
  S.recs.forEach((r,i)=>{
    const rt=ratio&&r.vals[vs[0]]!==undefined&&r.vals[as[0]]>0?(r.vals[vs[0]]/r.vals[as[0]]).toFixed(1):'-';
    h+=`<tr><td>${i+1}</td><td><span class="dot" style="background:${SCOL[(r.set-1)%SCOL.length]}"></span>${r.set}</td>${L.map(l=>`<td>${r.vals[l]===undefined?'':r.vals[l]}</td>`).join('')}${ratio?`<td>${rt}</td>`:''}<td><button class="btn sm" data-act="delrec" data-id="${r.id}">✕</button></td></tr>`;
  });
  return h+`</table></div><p class="sel-note">같은 회로에서 저항을 바꿔 다시 측정하려면 <b>➕ 새 세트</b>를 눌러요.</p>`;
}
function nice(max){
  if(!(max>0))return{max:1,step:0.2};
  const k=Math.pow(10,Math.floor(Math.log10(max/5)));
  for(const m of [1,2,2.5,5,10]){const st=m*k;if(max/st<=6)return{max:Math.ceil(max/st-1e-9)*st,step:st};}
  return{max:max,step:max/5};
}
function graphHTML(){
  const L=labelsAll();
  if(S.recs.length<1||L.length<2)return `<div class="card"><p>[🗂 기록]에서 값을 기록하면 그래프에 점이 찍혀요. (예: 전압 V1 – 전류 A1)</p></div>`;
  if(!L.includes(UI.gx))UI.gx=L.find(l=>l[0]==='V')||L[0];
  if(!L.includes(UI.gy))UI.gy=L.find(l=>l[0]==='A')||L.find(l=>l!==UI.gx);
  const gx=UI.gx,gy=UI.gy;
  const pts=S.recs.filter(r=>r.vals[gx]!==undefined&&r.vals[gy]!==undefined).map(r=>({x:r.vals[gx],y:r.vals[gy],s:r.set}));
  const opt=(sel)=>L.map(l=>`<option value="${l}" ${l===sel?'selected':''}>${l} (${unitOf(l)})</option>`).join('');
  let h=`<div class="row"><label>X축 <select data-sel="gx">${opt(gx)}</select></label><label>Y축 <select data-sel="gy">${opt(gy)}</select></label></div>
   <label class="row"><input type="checkbox" data-act="trend" ${UI.trend?'checked':''}> 점들을 지나는 직선(추세선) 그려 보기</label>`;
  if(!pts.length)return h+'<p class="sel-note">선택한 두 값이 함께 기록된 자료가 없어요.</p>';
  const xs=nice(Math.max(...pts.map(p=>p.x))),ys=nice(Math.max(...pts.map(p=>p.y)));
  const w=380,hh=320,ml=54,mr=26,mt=16,mb=42,pw=w-ml-mr,ph=hh-mt-mb;
  const X=v=>ml+v/xs.max*pw,Y=v=>mt+ph-v/ys.max*ph;
  const lab=v=>String(+v.toFixed(4));
  let svg=`<svg viewBox="0 0 ${w} ${hh}" style="width:100%;background:#fff;border:1px solid var(--line);border-radius:10px">`;
  for(let v=0;v<=xs.max+1e-9;v+=xs.step){svg+=`<line x1="${X(v)}" y1="${mt}" x2="${X(v)}" y2="${mt+ph}" stroke="#e5ebf3"/><text x="${X(v)}" y="${mt+ph+15}" font-size="11" text-anchor="middle" fill="#445">${lab(v)}</text>`;}
  for(let v=0;v<=ys.max+1e-9;v+=ys.step){svg+=`<line x1="${ml}" y1="${Y(v)}" x2="${ml+pw}" y2="${Y(v)}" stroke="#e5ebf3"/><text x="${ml-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#445">${lab(v)}</text>`;}
  svg+=`<line x1="${ml}" y1="${mt+ph}" x2="${ml+pw}" y2="${mt+ph}" stroke="#333" stroke-width="1.8"/><line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" stroke="#333" stroke-width="1.8"/>
   <text x="${ml+pw/2}" y="${hh-6}" font-size="12" font-weight="800" text-anchor="middle" fill="#1f3a5f">${gx} (${unitOf(gx)})</text>
   <text x="13" y="${mt+ph/2}" font-size="12" font-weight="800" text-anchor="middle" fill="#1f3a5f" transform="rotate(-90 13 ${mt+ph/2})">${gy} (${unitOf(gy)})</text>`;
  const sets=[...new Set(pts.map(p=>p.s))];
  let info='',dots='',coords='';
  sets.forEach(sn=>{
    const col=SCOL[(sn-1)%SCOL.length],P=pts.filter(p=>p.s===sn);
    let txt='';
    if(P.length>=2){
      const sxx=P.reduce((a,p)=>a+p.x*p.x,0),sxy=P.reduce((a,p)=>a+p.x*p.y,0);
      if(sxx>0){
        const k=sxy/sxx;
        if(UI.trend&&k>0){const xe=Math.min(xs.max,ys.max/k);svg+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(xe)}" y2="${Y(k*xe)}" stroke="${col}" stroke-width="2" opacity=".5"/>`;}
        const xv=gx[0]==='V'||gx[0]==='E',yc=gy[0]==='A';
        if(xv&&yc&&k>0)txt=`기울기 ${k.toPrecision(3)} A/V → R ≈ ${(1/k).toFixed(1)} Ω`;
        else if(gx[0]==='A'&&(gy[0]==='V'||gy[0]==='E')&&k>0)txt=`기울기 ≈ ${k.toFixed(1)} V/A → R ≈ ${k.toFixed(1)} Ω`;
        else txt=`기울기 ${k.toPrecision(3)}`;
      }
    }
    P.forEach(p=>{
      dots+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" fill="${col}" stroke="#fff" stroke-width="2"/>
        <text x="${X(p.x)+8}" y="${Y(p.y)-8}" font-size="10.5" font-weight="800" fill="${col}" stroke="#fff" stroke-width="3" paint-order="stroke">(${lab(p.x)}, ${lab(p.y)})</text>`;
    });
    info+=`<div><span class="dot" style="background:${col}"></span><b>세트 ${sn}</b> (${P.length}개) ${txt?'· '+txt:''}</div>`;
    coords+=`<tr><td><span class="dot" style="background:${col}"></span>${sn}</td><td class="tbl-end">${P.map(p=>`(${lab(p.x)}, ${lab(p.y)})`).join(' &nbsp;')}</td></tr>`;
  });
  svg+=dots+'</svg>';
  return h+svg+`<div class="legend" style="flex-direction:column;gap:3px">${info}</div>
    <div class="tblwrap"><table><tr><th>세트</th><th>점의 좌표 (${gx}, ${gy})</th></tr>${coords}</table></div>
    <p class="sel-note">💡 점들이 <b>원점을 지나는 직선</b> 위에 놓이면 전류가 전압에 비례(R 일정)해요. 직선의 기울기는 1/R!</p>`;
}

  else if(a==='del')delSel();
  else if(a==='bv'&&c){pushUndo();setVolt(c.id,c.val+ +b.dataset.d,false);renderPanel();}
  else if(a==='bvset'&&c){pushUndo();setVolt(c.id,+b.dataset.v,false);renderPanel();}
  else if(a==='rv'&&c){mut(()=>{c.val=+b.dataset.v;});}
  else if(a==='tog'&&c){mut(()=>{c.on=!c.on;});}
  else if(a==='zoomOpen'){UI.zoom=true;renderZoom();}
  else if(a==='rec')recordNow();
  else if(a==='newset'){S.cur++;save();renderPanel();toast(`새 세트(${S.cur}) 시작! 회로 조건을 바꿔 다시 측정해요`);}
  else if(a==='delrec'){S.recs=S.recs.filter(r=>r.id!==+b.dataset.id);save();renderPanel();}
  else if(a==='clrrec'){if(S.recs.length&&confirm('기록한 데이터를 모두 지울까요?')){S.recs=[];S.cur=1;save();renderPanel();}}
  else if(a==='csv')csv();
});
$('#tabBody').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.in==='volt'&&UI.sel){setVolt(UI.sel.id,+t.value,true);}
});
$('#tabBody').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sel){UI[t.dataset.sel]=t.value;renderPanel();}
  else if(t.dataset.act==='hide'){UI.hide=t.checked;renderBoard();refreshLive();}
  else if(t.dataset.act==='trend'){UI.trend=t.checked;renderPanel();}
});
function csv(){
  if(!S.recs.length){toast('기록이 없어요');return;}
  const L=labelsAll();
  const rows=[['번호','세트',...L.map(l=>`${l}(${unitOf(l)})`)].join(',')];
  S.recs.forEach((r,i)=>rows.push([i+1,r.set,...L.map(l=>r.vals[l]===undefined?'':r.vals[l])].join(',')));
  try{
    const blob=new Blob(['﻿'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='circuit-lab-data.csv';document.body.appendChild(a);a.click();a.remove();
  }catch(_){toast('이 브라우저에서는 저장이 어려워요');}
}

/* ---------- 공통 ---------- */
let tt=null;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2300);}
const KEY='circuitLabV11';
function save(){try{localStorage.setItem(KEY,JSON.stringify({comps:S.comps.map(clean),wires:S.wires,nid:S.nid,cur:S.cur,recs:S.recs}));}catch(_){}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.comps&&o.comps.length){S.comps=o.comps;S.wires=o.wires||[];S.nid=o.nid||100;S.cur=o.cur||1;S.recs=o.recs||[];return true;}}catch(_){}return false;}
function refresh(){analyze();renderBoard();renderToolbar();renderMsgs();renderPanel();renderZoom();save();}
window.addEventListener('resize',()=>{fitView();});

$('#verTag').textContent='v'+VERSION;
renderPalette();
if(load()){analyze();renderBoard();renderToolbar();renderMsgs();renderPanel();fitView();}
else{loadEx('basic');undoStack=[];}
requestAnimationFrame(frame);
</script>
</body>
</html>
